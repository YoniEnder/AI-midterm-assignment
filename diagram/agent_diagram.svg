<svg width="1600" height="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="800" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Multi-Agent System with MCP Integration</text>
  
  <!-- User Query -->
  <rect x="640" y="60" width="160" height="60" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="720" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">User Query</text>
  
  <!-- Manager Router Agent -->
  <rect x="640" y="180" width="160" height="100" rx="10" fill="#4A90E2" stroke="#000000" stroke-width="2"/>
  <text x="720" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Manager Router Agent</text>
  <text x="720" y="235" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">Routes queries</text>
  <text x="720" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">HIGH_LEVEL → Summarization</text>
  <text x="720" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">PRECISE → Needle</text>
  
  <!-- Summary Index -->
  <rect x="80" y="420" width="200" height="120" rx="10" fill="#FFD93D" stroke="#000000" stroke-width="2"/>
  <text x="180" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Summary Index</text>
  <text x="180" y="475" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Large Chunks</text>
  <text x="180" y="495" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">(800-1200 tokens)</text>
  <text x="180" y="515" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Tree Summarize</text>
  
  <!-- Hierarchical Index -->
  <rect x="80" y="620" width="200" height="140" rx="10" fill="#FFD93D" stroke="#000000" stroke-width="2"/>
  <text x="180" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Hierarchical Index</text>
  <text x="180" y="675" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Multi-size Chunks</text>
  <text x="180" y="695" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Small (150-250)</text>
  <text x="180" y="715" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Medium (400-600)</text>
  <text x="180" y="735" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Large (800-1200)</text>
  
  <!-- Summarization Expert Agent -->
  <rect x="1320" y="420" width="200" height="120" rx="10" fill="#50C878" stroke="#000000" stroke-width="2"/>
  <text x="1420" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Summarization Expert Agent</text>
  <text x="1420" y="475" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">High-level questions</text>
  <text x="1420" y="495" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Timelines &amp; Overviews</text>
  
  <!-- Needle-in-a-Haystack Agent -->
  <rect x="1320" y="620" width="200" height="120" rx="10" fill="#FF6B6B" stroke="#000000" stroke-width="2"/>
  <text x="1420" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Needle-in-a-Haystack Agent</text>
  <text x="1420" y="675" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Precise factual queries</text>
  <text x="1420" y="695" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Exact details &amp; dates</text>
  
  <!-- MCP Tool -->
  <rect x="600" y="920" width="240" height="140" rx="10" fill="#9B59B6" stroke="#000000" stroke-width="2"/>
  <text x="720" y="950" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">ClaimTimelineAnalyticsTool (MCP)</text>
  <text x="720" y="975" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">time_diff()</text>
  <text x="720" y="995" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">sla_check()</text>
  <text x="720" y="1015" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">timeline_summary_stats()</text>
  <text x="720" y="1035" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">events_in_range()</text>
  
  <!-- Arrow: User → Manager -->
  <line x1="720" y1="120" x2="720" y2="180" stroke="#34495E" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="750" y="145" font-family="Arial, sans-serif" font-size="10" fill="#34495E">Query</text>
  
  <!-- Arrow: Manager → Summarization Agent -->
  <line x1="800" y1="230" x2="1320" y2="480" stroke="#50C878" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="1000" y="320" width="80" height="20" rx="5" fill="#50C878" opacity="0.5"/>
  <text x="1040" y="335" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">HIGH_LEVEL</text>
  
  <!-- Arrow: Manager → Needle Agent -->
  <line x1="800" y1="280" x2="1320" y2="680" stroke="#FF6B6B" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="1000" y="520" width="80" height="20" rx="5" fill="#FF6B6B" opacity="0.5"/>
  <text x="1040" y="535" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">PRECISE</text>
  
  <!-- Arrow: Manager → Summary Index (dashed) -->
  <line x1="640" y1="230" x2="280" y2="480" stroke="#34495E" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="400" y="360" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#34495E">Select Index</text>
  
  <!-- Arrow: Manager → Hierarchical Index (dashed) -->
  <line x1="640" y1="280" x2="280" y2="680" stroke="#34495E" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow: Summarization Agent → Summary Index -->
  <line x1="1320" y1="480" x2="280" y2="480" stroke="#50C878" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="800" y="470" font-family="Arial, sans-serif" font-size="9" fill="#50C878">Query</text>
  
  <!-- Arrow: Needle Agent → Hierarchical Index -->
  <line x1="1320" y1="680" x2="280" y2="680" stroke="#FF6B6B" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="800" y="670" font-family="Arial, sans-serif" font-size="9" fill="#FF6B6B">Query</text>
  
  <!-- Arrow: Summary Index → Summarization Agent (dashed) -->
  <line x1="280" y1="480" x2="1320" y2="480" stroke="#50C878" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="800" y="430" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#50C878">Retrieved Chunks</text>
  
  <!-- Arrow: Hierarchical Index → Needle Agent (dashed) -->
  <line x1="280" y1="680" x2="1320" y2="680" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="800" y="630" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#FF6B6B">Retrieved Chunks</text>
  
  <!-- Arrow: Summarization Agent → MCP Tool -->
  <line x1="1320" y1="540" x2="840" y2="920" stroke="#9B59B6" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="1100" y="760" width="140" height="20" rx="5" fill="#9B59B6" opacity="0.5"/>
  <text x="1170" y="775" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#ffffff">Timeline Analytics Query</text>
  
  <!-- Arrow: Needle Agent → MCP Tool -->
  <line x1="1320" y1="740" x2="840" y2="1040" stroke="#9B59B6" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow: MCP Tool → Summarization Agent (dashed) -->
  <line x1="840" y1="920" x2="1320" y2="540" stroke="#9B59B6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="1080" y="720" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#9B59B6">Analytics Results</text>
  
  <!-- Arrow: MCP Tool → Needle Agent (dashed) -->
  <line x1="840" y1="1040" x2="1320" y2="740" stroke="#9B59B6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow: Summarization Agent → User -->
  <line x1="1420" y1="420" x2="720" y2="120" stroke="#34495E" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="1200" y="220" font-family="Arial, sans-serif" font-size="9" fill="#34495E">Answer</text>
  
  <!-- Arrow: Needle Agent → User -->
  <line x1="1420" y1="620" x2="720" y2="120" stroke="#34495E" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495E" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="80" y="800" width="200" height="200" rx="10" fill="#f9f9f9" stroke="#000000" stroke-width="1"/>
  <text x="180" y="825" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Legend</text>
  <rect x="100" y="845" width="30" height="20" fill="#4A90E2" stroke="#000000"/>
  <text x="140" y="860" font-family="Arial, sans-serif" font-size="10">Manager Router</text>
  <rect x="100" y="875" width="30" height="20" fill="#50C878" stroke="#000000"/>
  <text x="140" y="890" font-family="Arial, sans-serif" font-size="10">Summarization Agent</text>
  <rect x="100" y="905" width="30" height="20" fill="#FF6B6B" stroke="#000000"/>
  <text x="140" y="920" font-family="Arial, sans-serif" font-size="10">Needle Agent</text>
  <rect x="100" y="935" width="30" height="20" fill="#FFD93D" stroke="#000000"/>
  <text x="140" y="950" font-family="Arial, sans-serif" font-size="10">Indexes</text>
  <rect x="100" y="965" width="30" height="20" fill="#9B59B6" stroke="#000000"/>
  <text x="140" y="980" font-family="Arial, sans-serif" font-size="10">MCP Tool</text>
</svg>


